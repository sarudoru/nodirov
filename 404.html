<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Not found / Sardor Nodirov</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="preload" href="/assets/fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <script>
      document.documentElement.classList.add("js");
      setTimeout(() => {
        if (!document.querySelector("#article.ready")) document.documentElement.classList.remove("js");
      }, 6000);
      // a theme chosen on an earlier visit, before the first paint
      try {
        const theme = localStorage.getItem("glyph-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <div id="scroller" tabindex="-1">
      <main id="article">
        <header id="hero">
          <h1>404</h1>
          <p class="tagline">Not found</p>
          <p>These cells have nothing to show. The page is at <a href="/">nodirov.com</a>.</p>
        </header>
      </main>
    </div>

    <button id="sound" type="button" aria-pressed="true">sound on</button>
    <button id="theme" type="button" aria-label="Dark theme" aria-pressed="false">light</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
